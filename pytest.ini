[pytest]
# Pytest Configuration for English Pronunciation AI

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Directory to search for tests
testpaths = tests

# Minimum Python version
minversion = 7.0

# Command line options always applied
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Coverage options
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    # Warnings
    -W ignore::DeprecationWarning
    --tb=short

# Custom markers
markers =
    unit: Unit tests for individual functions/methods
    integration: Integration tests across multiple components
    slow: Tests that take significant time to run (skip with -m "not slow")
    requires_audio: Tests that require real audio files
    api: API endpoint tests
    ui: Streamlit UI tests
    performance: Performance and benchmark tests

# Coverage options
[coverage:run]
source = .
omit =
    tests/*
    venv/*
    env/*
    */site-packages/*
    setup.py
    demo.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # Don't complain about missing debug-only code
    def __repr__
    if self\.debug

    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError

    # Don't complain if non-runnable code isn't run
    if 0:
    if False:
    if __name__ == .__main__.:

    # Don't complain about abstract methods
    @(abc\.)?abstractmethod

[coverage:html]
directory = htmlcov
